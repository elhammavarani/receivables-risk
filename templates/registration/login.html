{% extends "base.html" %}

{% block title %}
ورود
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>ورود به سیستم</h1>

        {% if form.errors %}
            <p>نام کاربری یا رمز عبور اشتباه است.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                ورود
            </button>
        </form>

    </div>

</div>

{% endblock %}
