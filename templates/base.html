{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        سیستم مدیریت مطالبات
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/app.css' %}"
    >
</head>

<body>
    

    {% if user.is_authenticated %}

        <header class="topbar">

            <div class="topbar-inner">

                <div class="topbar-brand">

                    <div class="topbar-brand-icon">
    <svg
        width="21"
        height="21"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >
        <path
            d="M7 3.5H14.5L19 8V20.5H7V3.5Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
        />

        <path
            d="M14 3.5V8.5H19"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
        />

        <path
            d="M10 14.5L12 16.5L16 12.5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
        />
    </svg>
</div>

                    <div class="topbar-title">
                        سیستم مدیریت مطالبات
                    </div>

                </div>

                <div class="topbar-actions">
                    <a href="{% url 'dashboard_home' %}" class="logout-button dashboard-link" style="text-decoration: none;">
                        داشبورد
                    </a>

                    <a href="{% url 'upload_file' %}" class="logout-button dashboard-link" style="text-decoration: none;">
                        ورود اطلاعات
                    </a>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="logout-button">خروج</button>
                    </form>
                </div>

            </div>

        </header>

    {% endif %}


    <main class="page-container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
