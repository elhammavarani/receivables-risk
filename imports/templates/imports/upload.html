<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Import Receivables</title>
</head>
<body>

    <h1>Import Receivables</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="file" name="file" accept=".xlsx,.xls,.csv">

        <button type="submit">Upload</button>
    </form>

    {% if uploaded_file %}
        <p>File received: {{ uploaded_file.name }}</p>
    {% endif %}

    {% if columns %}
        <h2>Columns</h2>

        <ul>
            {% for column in columns %}
                <li>{{ column }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    {% if preview %}
        <h2>Preview</h2>

        {{ preview|safe }}
    {% endif %}

</body>
</html>
